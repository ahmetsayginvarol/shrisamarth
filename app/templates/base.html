function applyLanguage(lang) {
    document.documentElement.lang = lang;
    localStorage.setItem('lang', lang);

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        const val = TRANSLATIONS[lang][key];
        if (val) {
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = val;
            } else {
                el.textContent = val;
            }
        }
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        const val = (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS['en'][key];
        if (val) el.placeholder = val;
    });

    // Update toggle button
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === lang);
    });
}

function initLanguage() {
    const saved = localStorage.getItem('lang') || 'en';
    applyLanguage(saved);
}

document.addEventListener('DOMContentLoaded', initLanguage);

function t(key) {
    const lang = localStorage.getItem('lang') || 'en';
    return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || (TRANSLATIONS['en'] && TRANSLATIONS['en'][key]) || key;
}
</script>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-container" id="flashContainer">
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function() {
                var fc = document.getElementById('flashContainer');
                if (fc) {
                    fc.style.transition = 'opacity 0.5s';
                    fc.style.opacity = '0';
                    setTimeout(function() { fc.remove(); }, 500);
                }
            }, 3000);
        </script>
    {% endif %}
{% endwith %}

    {% block content %}{% endblock %}

    <script>
    // Prevent double-submit on all standard HTML forms
    document.addEventListener('submit', function(e) {
        const btn = e.target.querySelector('[type="submit"]:not([data-no-disable])');
        if (!btn || btn.disabled) return;
        btn.disabled = true;
        if (btn.tagName === 'BUTTON') { btn._origHTML = btn.innerHTML; btn.textContent = 'Please wait…'; }
        else { btn._origVal = btn.value; btn.value = 'Please wait…'; }
        window.addEventListener('pageshow', function() {
            btn.disabled = false;
            if (btn._origHTML !== undefined) btn.innerHTML = btn._origHTML;
            if (btn._origVal !== undefined) btn.value = btn._origVal;
        }, { once: true });
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
