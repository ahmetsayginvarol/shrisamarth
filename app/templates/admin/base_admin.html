{% extends 'base.html' %}

{% block content %}
<!-- Mobile-only topbar with hamburger (hidden ≥ 769px via CSS) -->
<div class="admin-mobile-bar" id="adminMobileBar">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <span style="font-family:'Instrument Serif',serif;font-size:16px;letter-spacing:0.1em;">SHRISAMARTH</span>
    <a href="{{ url_for('auth.logout') }}" class="btn btn-ghost"
       style="padding:6px 12px;font-size:12px;border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);">
        Sign out
    </a>
</div>

<!-- Tap-outside overlay to close sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="admin-layout">
    {% include 'admin/_sidebar.html' %}
    <div class="admin-main" style="padding: 0;">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">श्री</span>
                <div>
                    <div class="brand-name">SHRISAMARTH</div>
                    <div class="brand-sub" data-i18n="admin.sidebar.title">Admin Panel</div>
                </div>
            </div>
            <div class="topbar-right">
                <div class="pill-group">
                    <button class="pill lang-btn active" data-lang="en" onclick="applyLanguage('en')">EN</button>
                    <button class="pill lang-btn" data-lang="hi" onclick="applyLanguage('hi')">हिं</button>
                </div>
                <div class="notif-wrapper">
                    <div class="notif-bell" id="notifBell" onclick="toggleNotifDropdown()">
                        🔔
                        <span class="notif-badge hidden" id="notifBadge">0</span>
                    </div>
                    <div class="notif-dropdown hidden" id="notifDropdown">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button onclick="markAllRead()" class="notif-mark-all">Mark all read</button>
                        </div>
                        <div id="notifList" class="notif-list">
                            <div class="notif-empty">Loading…</div>
                        </div>
                    </div>
                </div>
                <span class="muted">{{ current_user.full_name }}</span>
            </div>
        </header>
        <div class="admin-content" style="padding: 40px;">
            {% block admin_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Prevent double-submit on all standard HTML forms
document.addEventListener('submit', function(e) {
    const btn = e.target.querySelector('[type="submit"]:not([data-no-disable])');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    if (btn.tagName === 'BUTTON') { btn._origHTML = btn.innerHTML; btn.textContent = 'Please wait…'; }
    else { btn._origVal = btn.value; btn.value = 'Please wait…'; }
    window.addEventListener('pageshow', function() {
        btn.disabled = false;
        if (btn._origHTML !== undefined) btn.innerHTML = btn._origHTML;
        if (btn._origVal !== undefined) btn.value = btn._origVal;
    }, { once: true });
});

function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        document.querySelector('.sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('active');
    }
});

// ── Notification bell ──
const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]')?.content || '';
let notifOpen = false;

async function loadNotifications() {
    try {
        const res = await fetch('/staff/api/notifications');
        const data = await res.json();
        const badge = document.getElementById('notifBadge');
        if (badge) {
            if (data.unread > 0) {
                badge.textContent = data.unread > 99 ? '99+' : data.unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
        const list = document.getElementById('notifList');
        if (!list) return;
        if (!data.notifications.length) {
            list.innerHTML = '<div class="notif-empty">No notifications</div>';
            return;
        }
        list.innerHTML = data.notifications.map(n => {
            const icon = n.title.includes('Cancel') ? '❌' : '🎫';
            const waBtn = n.passenger_phone
                ? `<a class="notif-wa-btn" href="https://wa.me/${n.passenger_phone.replace(/\D/g,'')}" target="_blank">💬</a>`
                : '';
            return `<div class="notif-item ${n.is_read ? '' : 'unread'}" data-id="${n.id}" data-link="${n.link||''}" onclick="handleNotifClick(this)">
                <div class="notif-icon">${icon}</div>
                <div>
                    <div class="notif-title-row">${n.title}</div>
                    <div class="notif-msg">${n.message}</div>
                    <div class="notif-time">${n.time_ago}</div>
                </div>
                ${waBtn}
            </div>`;
        }).join('');
    } catch(e) { console.error('Notif load failed', e); }
}

function toggleNotifDropdown() {
    const dd = document.getElementById('notifDropdown');
    if (!dd) return;
    notifOpen = !notifOpen;
    dd.classList.toggle('hidden', !notifOpen);
    if (notifOpen) loadNotifications();
}

async function handleNotifClick(el) {
    const id = el.dataset.id;
    const link = el.dataset.link;
    await fetch(`/staff/api/notifications/read/${id}`, { method: 'POST', headers: {'X-CSRFToken': CSRF_TOKEN} });
    if (link) window.location.href = link;
    else toggleNotifDropdown();
}

async function markAllRead() {
    await fetch('/staff/api/notifications/read-all', { method: 'POST', headers: {'X-CSRFToken': CSRF_TOKEN} });
    loadNotifications();
}

document.addEventListener('click', function(e) {
    if (notifOpen && !e.target.closest('#notifBell') && !e.target.closest('#notifDropdown')) {
        notifOpen = false;
        document.getElementById('notifDropdown')?.classList.add('hidden');
    }
});

document.addEventListener('DOMContentLoaded', loadNotifications);
</script>
{% endblock %}
