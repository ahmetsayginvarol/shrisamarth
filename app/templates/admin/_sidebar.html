<aside class="sidebar">
    <div class="sidebar-brand">
        <span class="brand-mark">श्री</span>
        <div>
            <div class="brand-name">SHRISAMARTH</div>
            <div class="brand-sub" data-i18n="admin.sidebar.title">Admin Panel</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="{{ url_for('admin.dashboard') }}"
           class="nav-item {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
            <span class="nav-icon">⬡</span>
            <span data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a href="{{ url_for('staff.dashboard') }}"
           class="nav-item {% if request.endpoint == 'staff.dashboard' %}active{% endif %}">
            <span class="nav-icon">▦</span>
            <span data-i18n="nav.seatmap">Seat Map</span>
        </a>
        <a href="{{ url_for('admin.voyages') }}"
           class="nav-item {% if 'voyage' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">⊛</span>
            <span data-i18n="nav.voyages">Voyages</span>
        </a>
        <a href="{{ url_for('admin.buses') }}"
           class="nav-item {% if 'bus' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">⬕</span>
            <span data-i18n="nav.buses">Buses</span>
        </a>
        <a href="{{ url_for('admin.users') }}"
           class="nav-item {% if 'user' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">◎</span>
            <span data-i18n="nav.users">Users</span>
        </a>

        <a href="{{ url_for('admin.passengers') }}"
           class="nav-item {% if 'passenger' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">👤</span>
            <span>Passengers</span>
        </a>
        <a href="{{ url_for('admin.logs') }}"
           class="nav-item {% if 'logs' in request.endpoint %}active{% endif %}">
            <span class="nav-icon">☰</span>
            <span data-i18n="nav.logs">Activity Log</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="avatar">{{ current_user.full_name[0] }}</div>
            <div>
                <div style="font-size:13px; font-weight:500;">{{ current_user.full_name }}</div>
                <div style="font-size:11px; color:var(--muted);">{{ current_user.role|capitalize }}</div>
            </div>
        </div>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-ghost"
           style="width:100%; margin-top:12px; text-align:center;" data-i18n="nav.signout">
            Sign out
        </a>
    </div>
</aside>
