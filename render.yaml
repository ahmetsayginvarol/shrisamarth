services:
  - type: web
    name: shrisamarth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn -w 1 --threads 100 run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shrisamarth-db
          property: connectionString

databases:
  - name: shrisamarth-db
    plan: free